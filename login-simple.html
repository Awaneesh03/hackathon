<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – CampusDash</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="shared.css">

    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--yellow) 0%, #FFF8CC 100%);
            padding: 2rem;
        }

        .auth-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-top: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 1rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--purple);
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: var(--black);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }

        .btn-login:hover {
            opacity: 0.9;
        }

        .message {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
        }

        .signup-link {
            text-align: center;
            margin-top: 1rem;
            color: #6b7280;
        }

        .signup-link a {
            color: var(--purple);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div
                    style="background: black; color: #FFD300; width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                    <i data-lucide="zap" width="32" stroke-width="3"></i>
                </div>
                <h1>CampusDash</h1>
                <p style="color: #6b7280;">Simple Login (Demo Mode)</p>
            </div>

            <div class="message" id="message"></div>

            <form id="simple-login-form">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="email" placeholder="your.email@campus.edu" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="password" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn-login">Login (Demo)</button>
            </form>

            <div class="signup-link">
                <p><strong>Demo Credentials:</strong></p>
                <p style="font-size: 0.875rem; margin-top: 0.5rem;">
                    Email: demo@campus.edu<br>
                    Password: demo123
                </p>
                <p style="margin-top: 1rem; font-size: 0.875rem;">
                    Or use any email/password to create account
                </p>
            </div>
        </div>
    </div>

    <script>
        // Simple localStorage-based auth
        const form = document.getElementById('simple-login-form');
        const messageDiv = document.getElementById('message');

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message show ' + type;
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Get stored users
            let users = JSON.parse(localStorage.getItem('campusdash_users') || '{}');

            // Check if user exists
            if (users[email]) {
                // Check password
                if (users[email].password === password) {
                    // Login successful
                    localStorage.setItem('campusdash_current_user', JSON.stringify({
                        email: email,
                        name: users[email].name,
                        role: users[email].role
                    }));

                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1000);
                } else {
                    showMessage('Invalid password!', 'error');
                }
            } else {
                // Auto-create account
                users[email] = {
                    password: password,
                    name: email.split('@')[0],
                    role: 'student',
                    created: new Date().toISOString()
                };
                localStorage.setItem('campusdash_users', JSON.stringify(users));

                localStorage.setItem('campusdash_current_user', JSON.stringify({
                    email: email,
                    name: users[email].name,
                    role: users[email].role
                }));

                showMessage('Account created! Logging you in...', 'success');
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 1000);
            }
        });

        // Check if already logged in
        const currentUser = localStorage.getItem('campusdash_current_user');
        if (currentUser) {
            window.location.href = '/index.html';
        }

        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>

</html>
